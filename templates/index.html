<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station — Captors</title>
<script src="{{ url_for('static', filename='chart.umd.js') }}"></script>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16212c;
    --panel-line: #26363f;
    --ink: #e7edf1;
    --ink-dim: #8ea3ad;
    --humidity: #4fb0c6;
    --humidity-glow: rgba(79, 176, 198, 0.18);
    --luminosity: #e8a94a;
    --luminosity-glow: rgba(232, 169, 74, 0.18);
    --temperature: #F54927;
    --temperature-glow: rgba(245, 73, 39, 0.18);
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 2.2rem 2rem 1.2rem;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  header .status {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 6px #4ade80;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 2rem;
  }

  .readouts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 2rem;
  }

  @media (max-width: 640px) {
    .readouts { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 1.6rem 1.8rem;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .card.humidity::before { background: var(--humidity); }
  .card.luminosity::before { background: var(--luminosity); }

  .card .label {
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 0.6rem;
  }

  .card .value {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
  }

  .card.humidity .value { color: var(--humidity); }
  .card.luminosity .value { color: var(--luminosity); }
  .card.temperature .value { color: var(--temperature); }

  .card .unit {
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink-dim);
  }

  .card .updated {
    margin-top: 0.9rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-dim);
  }

  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 1.6rem 1.8rem;
  }

  .chart-panel .label {
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 1rem;
  }

  canvas { max-height: 320px; }
</style>
</head>
<body>

<header>
  <h1>Station</h1>
  <div class="status"><span class="dot"></span><span id="status-text">reading captors…</span></div>
</header>

<main>
  <div class="readouts">
    <div class="card humidity">
      <div class="label">Humidity</div>
      <div class="value"><span id="humidity-value">—</span><span class="unit">%</span></div>
      <div class="updated" id="humidity-updated"></div>
    </div>
    <div class="card luminosity">
      <div class="label">Luminosity</div>
      <div class="value"><span id="luminosity-value">—</span><span class="unit">lux</span></div>
      <div class="updated" id="luminosity-updated"></div>
    </div>
    <div class="card temperature">
      <div class="label">Temperature</div>
      <div class="value"><span id="temperature-value">—</span><span class="unit"> Celsius</span></div>
      <div class="updated" id="temperature-updated"></div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="label">History</div>
    <canvas id="history-chart"></canvas>
  </div>
</main>

<script>
const ctx = document.getElementById('history-chart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      {
        label: 'Humidity (%)',
        data: [],
        borderColor: '#4fb0c6',
        backgroundColor: 'rgba(79,176,198,0.08)',
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 0,
        yAxisID: 'y',
        fill: true,
      },
      {
        label: 'Luminosity (lux)',
        data: [],
        borderColor: '#e8a94a',
        backgroundColor: 'rgba(232,169,74,0.08)',
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 0,
        yAxisID: 'y1',
        fill: true,
      },
      {
        label: 'Temperature (C)',
        data: [],
        borderColor: '#e8a94a',
        backgroundColor: 'rgba(232,169,74,0.08)',
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 0,
        yAxisID: 'y2',
        fill: true,
      }
    ]
  },
  options: {
    responsive: true,
    animation: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: { ticks: { color: '#8ea3ad', maxTicksLimit: 8 }, grid: { color: '#26363f' } },
      y: {
        position: 'left',
        ticks: { color: '#4fb0c6' },
        grid: { color: '#26363f' },
        title: { display: true, text: '%', color: '#4fb0c6' }
      },
      y1: {
        position: 'right',
        ticks: { color: '#e8a94a' },
        grid: { drawOnChartArea: false },
        title: { display: true, text: 'lux', color: '#e8a94a' }
      }
    },
    plugins: {
      legend: { labels: { color: '#e7edf1' } }
    }
  }
});

async function refreshCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();
    if (data.humidity !== null) {
      document.getElementById('humidity-value').textContent = data.humidity;
      document.getElementById('luminosity-value').textContent = data.luminosity;
      document.getElementById('temperature-value').textContent = data.temperature;
      document.getElementById('humidity-updated').textContent = 'updated ' + data.time;
      document.getElementById('luminosity-updated').textContent = 'updated ' + data.time;
      document.getElementById('temperature-updated').textContent = 'updated ' + data.time;
      document.getElementById('status-text').textContent = 'live';
    }
  } catch (e) {
    document.getElementById('status-text').textContent = 'connection lost';
  }
}

async function refreshHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    chart.data.labels = data.map(d => d.time);
    chart.data.datasets[0].data = data.map(d => d.humidity);
    chart.data.datasets[1].data = data.map(d => d.luminosity);
    chart.update();
  } catch (e) {
    // silent — will retry next tick
  }
}

refreshCurrent();
refreshHistory();
setInterval(refreshCurrent, 2000);
setInterval(refreshHistory, 2000);
</script>

</body>
</html>
