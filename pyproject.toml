[project]
name = "gardener"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "adafruit-circuitpython-bh1750>=1.1.19",
    "adafruit-circuitpython-bme280>=2.6.32",
    "flask>=3.1.3",
    "rpi-gpio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gardener"]
exclude = []
namespaces = false
